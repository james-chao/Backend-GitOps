apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: backend
  namespace: production

spec:
  ingressClassName: traefik

  rules:
  - host: api.company.local

    http:
      paths:
      - path: /
        pathType: Prefix

        backend:
          service:
            name: backend
            port:
              number: 80