apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: production

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      imagePullSecrets:
      - name: harbor-secret

      containers:
      - name: backend

        image: harbor.company.local:8443/backend/backend:1.0.0

        imagePullPolicy: Always

        ports:
        - containerPort: 8080