apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
      - name: harbor-secret
      containers:
      - name: backend
        image: harbor.company.local:8443/backend/backend:4
        imagePullPolicy: Always
        ports:
        - containerPort: 8234
        env:
        - name: ConnectionStrings__Postgres
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DB_CONNECTION_STRING
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: JWT_SECRET_KEY
        - name: JWT_ISSUER
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: JWT_ISSUER
        - name: JWT_AUDIENCE
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: JWT_AUDIENCE
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: ASPNETCORE_ENVIRONMENT
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi